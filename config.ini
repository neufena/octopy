[Application]
Verbose=true
ThreadDelay=0.05
KeyboardControl=false
StatusLed=0

[Media]
Local=~/media
Storage=
Mount=/media/thumb
Preload=false

[Audio]
Device=default
BufferSize=256
BufferPreload=2

[Midi]
# Device options: 'gpio', 'default', or 'null' (for testing without ALSA)
